<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e293b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#60a5fa;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Grid pattern (optional decorative element) -->
  <g opacity="0.05">
    <line x1="0" y1="157.5" x2="1200" y2="157.5" stroke="white" stroke-width="1"/>
    <line x1="0" y1="315" x2="1200" y2="315" stroke="white" stroke-width="1"/>
    <line x1="0" y1="472.5" x2="1200" y2="472.5" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="150" fill="url(#accentGradient)" opacity="0.1"/>
  <circle cx="1100" cy="530" r="200" fill="url(#accentGradient)" opacity="0.1"/>

  <!-- Content container -->
  <g transform="translate(100, 200)">
    <!-- Accent line -->
    <rect x="0" y="0" width="80" height="6" fill="url(#accentGradient)" rx="3"/>

    <!-- Main name -->
    <text x="0" y="80" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="bold" fill="white">
      Isaac Ramírez
    </text>

    <!-- Role -->
    <text x="0" y="140" font-family="system-ui, -apple-system, sans-serif" font-size="36" fill="#94a3b8">
      Computer Engineering Student
    </text>

    <!-- Specialization -->
    <text x="0" y="185" font-family="system-ui, -apple-system, sans-serif" font-size="28" fill="#64748b">
      Full-Stack Developer • AI/ML • Cloud Computing
    </text>
  </g>

  <!-- Domain badge -->
  <g transform="translate(100, 550)">
    <rect x="0" y="0" width="160" height="40" fill="#3b82f6" rx="20" opacity="0.2"/>
    <text x="80" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="20" fill="#60a5fa" text-anchor="middle" font-weight="500">
      izackk.com
    </text>
  </g>
</svg>
